<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e1704">
  <meta name="robots" content="noindex, nofollow">
  <title>Casa Aroa · Wi-Fi</title>
  <link rel="preload" href="fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/montserrat-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="img/hero.jpg" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">

    <!-- Panel visual: recepción del hotel -->
    <aside class="hero" id="hero">
      <div class="hero-photo" id="heroPhoto"></div>
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <p class="hero-kicker" data-i18n="kicker"></p>
        <img class="hero-logo" id="heroLogo" src="img/logo-white.svg" alt="Casa Aroa Barcelona">
        <p class="hero-quote" data-i18n-html="heroQuote"></p>
      </div>
    </aside>

    <!-- Contenido -->
    <main class="panel">
      <header class="top">
        <nav class="langs" id="langs" aria-label="Language"></nav>
      </header>

      <!-- Vista: formulario -->
      <section class="view" id="viewForm">
        <p class="eyebrow"><svg class="i" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 15.8a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/></svg><span data-i18n="eyebrow"></span></p>
        <h1 class="title" data-i18n-html="title"></h1>
        <p class="lead" data-i18n="lead"></p>

        <form id="form" novalidate>
          <div class="field">
            <input id="name" name="name" type="text" autocomplete="name" placeholder=" " required maxlength="80">
            <label for="name" data-i18n="name"></label>
          </div>

          <div class="row">
            <div class="field" id="fRoom">
              <input id="room" name="room" type="text" inputmode="numeric" autocomplete="off" placeholder=" " maxlength="8">
              <label for="room" data-i18n="room"></label>
            </div>
            <div class="field" id="fCode" hidden>
              <input id="accessCode" name="accessCode" type="text" autocomplete="off" autocapitalize="characters" placeholder=" " maxlength="32">
              <label for="accessCode" data-i18n="code"></label>
            </div>
          </div>

          <div class="field" id="fEmail">
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder=" " maxlength="120">
            <label for="email"><span data-i18n="email"></span> <em data-i18n="optional"></em></label>
          </div>

          <label class="check">
            <input type="checkbox" id="terms" name="terms" required>
            <span class="box" aria-hidden="true"></span>
            <span class="check-text"><span data-i18n="acceptPre"></span> <button type="button" class="link" id="openTerms" data-i18n="acceptLink"></button></span>
          </label>

          <label class="check" id="fMarketing">
            <input type="checkbox" id="marketing" name="marketing">
            <span class="box" aria-hidden="true"></span>
            <span class="check-text" data-i18n="marketing"></span>
          </label>

          <p class="error" id="error" role="alert" aria-live="assertive"></p>

          <button class="cta" type="submit" id="submit">
            <span class="cta-label" data-i18n="connect"></span>
            <span class="cta-spinner" aria-hidden="true"></span>
            <svg class="cta-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </section>

      <!-- Vista: conectado -->
      <section class="view" id="viewDone" hidden>
        <div class="seal" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/><path d="M20 33l8 8 16-17"/></svg>
        </div>
        <p class="eyebrow center" data-i18n="doneEyebrow"></p>
        <h1 class="title center" data-i18n-html="doneTitle"></h1>
        <p class="lead center" data-i18n="doneLead"></p>

        <figure class="postcard" id="postcard">
          <img src="img/barri-gotic.jpg" alt="" loading="lazy">
          <figcaption>
            <span class="postcard-kicker" data-i18n="hoodKicker"></span>
            <span class="postcard-title" data-i18n="hoodTitle"></span>
          </figcaption>
        </figure>

        <ul class="services" id="services"></ul>
        <a class="cta ghost" id="continue" href="#" hidden><span data-i18n="continue"></span><svg class="cta-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
      </section>

      <footer class="foot" id="foot"></footer>
    </main>
  </div>

  <!-- Condiciones de uso -->
  <div class="modal" id="termsModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
      <button class="modal-x" type="button" data-close aria-label="Cerrar">&times;</button>
      <h2 id="termsTitle" data-i18n="termsTitle"></h2>
      <div class="modal-body" id="termsBody"></div>
      <button class="cta small" type="button" id="acceptTerms"><span data-i18n="termsAccept"></span></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
