<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Finanzas de Casa</title>
<meta name="description" content="Ahorro y gastos de casa por años">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a household ledger. Sticky top bar with year + section tabs, then summary tiles,
   charts, and an editable month grid per section. Ahorro = green ink, Gastos = amber ink. */
:root {
  --bg: #f3f5f4;
  --surface: #fcfcfb;
  --surface-2: #eceff0;
  --line: #d9dedc;
  --fg: #14201c;
  --fg-2: #4d5955;
  --fg-3: #7a8581;
  --ahorro: #0f7a5f;
  --ahorro-soft: #dcefe8;
  --gastos: #b8640a;
  --gastos-soft: #f6e8d6;
  --neg: #c23b3b;
  --neg-soft: #f8e1e0;
  --focus: #2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --sother:#9aa3a0;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171d1b; --surface-2: #1f2724; --line: #2c3633;
    --fg: #eef3f1; --fg-2: #b5c0bc; --fg-3: #85918d;
    --ahorro: #3cc49a; --ahorro-soft: #173229; --gastos: #f0a24a; --gastos-soft: #352612;
    --neg: #ef7b7b; --neg-soft: #3a1d1d; --focus: #5d9ff0;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --sother:#6c7673;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171d1b; --surface-2: #1f2724; --line: #2c3633;
  --fg: #eef3f1; --fg-2: #b5c0bc; --fg-3: #85918d;
  --ahorro: #3cc49a; --ahorro-soft: #173229; --gastos: #f0a24a; --gastos-soft: #352612;
  --neg: #ef7b7b; --neg-soft: #3a1d1d; --focus: #5d9ff0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --sother:#6c7673;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0; }
table, input, select, button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 22px; font-weight: 700; }
.brand .sync { font-size: 12px; color: var(--fg-3); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.dot.ok { background: var(--ahorro); } .dot.busy { background: var(--gastos); } .dot.err { background: var(--neg); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--fg-2); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.tab[data-tab="ahorro"][aria-selected="true"] { color: var(--ahorro); }
.tab[data-tab="gastos"][aria-selected="true"] { color: var(--gastos); }
.yearbox { display: flex; gap: 8px; align-items: center; }
.yearbox select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-weight: 500; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.danger { color: var(--neg); }
.btn.sm { padding: 4px 9px; font-size: 13px; }

main { max-width: 1280px; margin: 0 auto; padding-block: 20px 60px; padding-inline: 20px; display: grid; gap: 20px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { font-size: 30px; font-weight: 700; }
.section-head p { margin: 2px 0 0; color: var(--fg-2); max-width: 70ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
[data-sec="ahorro"] .section-head h2 { color: var(--ahorro); }
[data-sec="gastos"] .section-head h2 { color: var(--gastos); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.kpi .label { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.kpi .value { font-family: var(--font-mono); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .sub { font-size: 12px; color: var(--fg-3); }
.kpi.hero { background: var(--ahorro-soft); border-color: transparent; }
.kpi.hero .value { color: var(--ahorro); }
.kpi.hero-g { background: var(--gastos-soft); border-color: transparent; }
.kpi.hero-g .value { color: var(--gastos); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; font-family: var(--font-mono); width: fit-content; }
.pill.up { background: var(--neg-soft); color: var(--neg); }
.pill.down { background: var(--ahorro-soft); color: var(--ahorro); }
.pill.neutral { background: var(--surface-2); color: var(--fg-2); }

/* Panels & charts */
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.grid-2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .grid-2, .grid-2.even { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.panel-head h3 { font-size: 16px; font-weight: 600; }
.panel-head .hint { font-size: 12px; color: var(--fg-3); }
.chart { position: relative; height: 280px; }
.chart.tall { height: 340px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Editable grid */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1100px; font-size: 13px; }
.grid th, .grid td { padding: 0; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.grid thead th { background: var(--surface-2); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); padding: 8px 6px; font-weight: 600; position: sticky; top: 0; }
.grid thead th.cur { color: var(--fg); box-shadow: inset 0 -2px 0 var(--fg); }
.grid th:first-child, .grid td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 170px; }
.grid thead th:first-child { background: var(--surface-2); z-index: 2; }
.grid td.calc { padding: 7px 8px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; }
.grid tfoot td { background: var(--surface-2); font-weight: 600; }
.grid tfoot td:first-child { background: var(--surface-2); padding: 7px 8px; }
.grid tfoot tr.strong td { color: var(--fg); }
.grid input { width: 100%; min-width: 66px; border: 0; background: transparent; padding: 7px 6px; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; border-radius: 0; }
.grid input.name { text-align: left; font-family: var(--font-body); font-weight: 500; min-width: 140px; }
.grid input:hover { background: var(--surface-2); }
.grid input:focus { background: var(--surface); outline: 2px solid var(--focus); outline-offset: -2px; }
.grid input.zero { color: var(--fg-3); }
.grid td.cur { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.grid .rowname { display: flex; align-items: center; gap: 2px; padding-left: 8px; }
.grid .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.grid .del { border: 0; background: transparent; color: var(--fg-3); cursor: pointer; padding: 4px 8px; font-size: 16px; line-height: 1; border-radius: 6px; }
.grid .del:hover { color: var(--neg); background: var(--neg-soft); }
.neg { color: var(--neg) !important; }
.pos { color: var(--ahorro) !important; }
table.simple { min-width: 560px; }
.grid select { border: 0; background: transparent; padding: 7px 6px; width: 100%; }
.grid td.left { text-align: left; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filler { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px; background: var(--surface-2); border-radius: 8px; }
.field { display: grid; gap: 3px; font-size: 12px; color: var(--fg-2); }
.field input, .field select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.field input.amt { width: 110px; font-family: var(--font-mono); }
.muted { color: var(--fg-3); font-size: 12px; }

/* Empty state */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-size: 22px; }
.empty p { color: var(--fg-2); max-width: 52ch; margin: 0; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; padding: 20px; width: min(460px, 100%); display: grid; gap: 14px; box-shadow: 0 20px 50px rgb(0 0 0 / .3); }
.modal h3 { font-size: 20px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.yearchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 60; }
@media (max-width: 560px) {
  .top-in { padding: 10px 16px; } main { padding-inline: 16px; }
  .section-head h2 { font-size: 24px; }
  .kpi .value { font-size: 20px; }
  .tab { padding: 6px 11px; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Finanzas de Casa</h1>
      <span class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncText">Cargando…</span></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" data-tab="ahorro" aria-selected="true" id="tab-ahorro">Ahorro</button>
      <button class="tab" role="tab" data-tab="gastos" aria-selected="false" id="tab-gastos">Gastos</button>
      <button class="tab" role="tab" data-tab="comparar" aria-selected="false" id="tab-comparar">Comparativa</button>
    </nav>
    <div class="yearbox">
      <label for="yearSel" class="muted">Año</label>
      <select id="yearSel" aria-label="Año"></select>
      <button class="btn" id="newYearBtn">+ Año</button>
      <button class="btn ghost" id="moreBtn" aria-haspopup="true">Datos</button>
    </div>
  </div>
</header>

<main id="main"></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="chart.umd.min.js"></script>
<script>
(() => {
'use strict';
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const LS_KEY = 'finanzas-casa-v1';
const LS_UI = 'finanzas-casa-ui';
const fmt = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2, minimumFractionDigits: 2, useGrouping: 'always' });
const fmt0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
const fmtN = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
const eur = v => fmt.format(v || 0);
const eur0 = v => fmt0.format(v || 0);
const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
const sum = a => r2(a.reduce((s, v) => s + (+v || 0), 0));
const uid = p => p + '-' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const parseNum = s => { if (typeof s === 'number') return s; s = String(s || '').trim().replace(/\s|€/g, ''); if (!s) return 0; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const v = parseFloat(s); return isFinite(v) ? r2(v) : 0; };
const inVal = v => v ? fmtN.format(v) : '';
const normName = s => String(s || '').trim().toUpperCase().replace(/\s+/g, ' ');
const NOW = new Date();

/* ---------- State ---------- */
const S = {
  years: {},            // "2026" -> {year, ahorro:{concepts, retiradas}, gastos:{concepts}}
  year: null,
  tab: 'ahorro',
  compareSel: null,     // array of year strings
  mode: 'local',        // 'local' | 'db'
  db: null,
  downloads: null,
  pending: {},          // year -> pending write count
  ready: false,
};
try { const ui = JSON.parse(localStorage.getItem(LS_UI) || '{}'); if (ui.tab) S.tab = ui.tab; if (ui.year) S.year = String(ui.year); } catch (e) {}
const saveUI = () => { try { localStorage.setItem(LS_UI, JSON.stringify({ tab: S.tab, year: S.year })); } catch (e) {} };

function normalizeYear(d, y) {
  d = d || {};
  const pad = m => Array.from({ length: 12 }, (_, i) => r2(+((m || [])[i]) || 0));
  return {
    year: +(d.year || y),
    ahorro: {
      concepts: ((d.ahorro && d.ahorro.concepts) || []).map(c => ({ id: c.id || uid('a'), name: c.name || '', saldo: r2(+c.saldo || 0), m: pad(c.m) })),
      retiradas: ((d.ahorro && d.ahorro.retiradas) || []).map(r => ({ id: r.id || uid('r'), desc: r.desc || '', fondo: r.fondo || '', month: Math.min(11, Math.max(0, +r.month || 0)), amount: r2(+r.amount || 0) })),
    },
    gastos: { concepts: ((d.gastos && d.gastos.concepts) || []).map(c => ({ id: c.id || uid('g'), name: c.name || '', m: pad(c.m) })) },
  };
}
const yearList = () => Object.keys(S.years).sort();
const Y = () => S.years[S.year];

/* ---------- Persistence ---------- */
function setSync(state, text) {
  document.getElementById('syncDot').className = 'dot ' + state;
  document.getElementById('syncText').textContent = text;
}
const timers = {}; const chains = {};
function scheduleSave(year) {
  year = String(year);
  if (S.mode === 'local') { saveLocal(); return; }
  S.pending[year] = (S.pending[year] || 0) + 1;
  setSync('busy', 'Guardando…');
  clearTimeout(timers[year]);
  timers[year] = setTimeout(() => {
    const data = S.years[year];
    chains[year] = (chains[year] || Promise.resolve()).then(async () => {
      try {
        if (data) await writeRemote(year, JSON.parse(JSON.stringify(data)));
        setSync('ok', S.mode === 'server' ? 'Guardado en el servidor' : 'Guardado');
      } catch (e) {
        setSync('err', e && e.code === 'invalid_argument' ? 'Sin permiso para guardar' : 'No se pudo guardar');
        toast('No se pudo guardar. Revisa la conexión e inténtalo de nuevo.');
      } finally { S.pending[year] = 0; }
    });
  }, 700);
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S.years)); setSync('ok', 'Guardado en este navegador'); }
  catch (e) { setSync('err', 'No se pudo guardar'); }
}
async function deleteYearStore(year) {
  delete S.years[year];
  if (S.mode === 'local') { saveLocal(); return; }
  clearTimeout(timers[year]);
  try { await removeRemote(year); setSync('ok', 'Guardado'); } catch (e) { toast('No se pudo borrar el año.'); }
}
/* Remote store: the artifact's db, or the optional local server (server.py, /api/years). */
async function writeRemote(year, data) {
  if (S.mode === 'db') return S.db.doc('years/' + year).set(data);
  const r = await fetch('api/years/' + year, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
async function removeRemote(year) {
  if (S.mode === 'db') return S.db.doc('years/' + year).delete();
  const r = await fetch('api/years/' + year, { method: 'DELETE' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
async function loadServer() {
  try {
    if (!/^https?:$/.test(location.protocol)) return null;
    const r = await fetch('api/years', { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j && typeof j.years === 'object' ? j.years : null;
  } catch (e) { return null; }
}
function applyServerYears(years) {
  let changed = false;
  Object.keys(years).forEach(k => {
    if (S.pending[k] > 0) return;
    const next = normalizeYear(years[k], k);
    if (JSON.stringify(next) !== JSON.stringify(S.years[k])) { S.years[k] = next; changed = true; }
  });
  Object.keys(S.years).forEach(k => { if (!(k in years) && !(S.pending[k] > 0)) { delete S.years[k]; changed = true; } });
  return changed;
}

async function initStore() {
  let db = null;
  try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
  try { if (window.claude && window.claude.use) S.downloads = await window.claude.use('downloads'); } catch (e) {}
  if (db) {
    S.mode = 'db'; S.db = db;
    setSync('busy', 'Conectando…');
    db.collection('years').onSnapshot(snap => {
      let changed = false;
      const seen = new Set();
      snap.docs.forEach(doc => {
        seen.add(doc.id);
        if (S.pending[doc.id] > 0) return;
        const next = normalizeYear(doc.data(), doc.id);
        if (JSON.stringify(next) !== JSON.stringify(S.years[doc.id])) { S.years[doc.id] = next; changed = true; }
      });
      Object.keys(S.years).forEach(k => { if (!seen.has(k) && !(S.pending[k] > 0)) { delete S.years[k]; changed = true; } });
      if (!S.ready || changed) { S.ready = true; afterDataChange(); }
      if (!snap.metadata.fromCache) setSync('ok', 'Sincronizado');
    }, () => setSync('err', 'Sin conexión con los datos'));
  } else if (await (async () => { const ys = await loadServer(); if (!ys) return false; S.mode = 'server'; applyServerYears(ys); return true; })()) {
    S.ready = true;
    setSync('ok', 'Guardado en el servidor');
    afterDataChange();
    // Recoge cambios hechos desde otros dispositivos de casa.
    setInterval(async () => {
      if (document.hidden || document.querySelector('.modal-bg') || (document.activeElement && document.activeElement.tagName === 'INPUT')) return;
      const ys = await loadServer();
      if (ys && applyServerYears(ys)) afterDataChange();
    }, 20000);
  } else {
    S.mode = 'local';
    try { const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); Object.keys(raw).forEach(k => S.years[k] = normalizeYear(raw[k], k)); } catch (e) {}

  }
}
function afterDataChange() {
  const ys = yearList();
  if (!S.years[S.year]) S.year = ys.includes(String(NOW.getFullYear())) ? String(NOW.getFullYear()) : (ys[ys.length - 1] || null);
  if (!S.compareSel) S.compareSel = ys.slice(-4);
  S.compareSel = S.compareSel.filter(y => S.years[y]);
  if (!S.compareSel.length) S.compareSel = ys.slice(-4);

/* ---------- Calculations ---------- */
function calcAhorro(d) {
  const cs = d.ahorro.concepts, rs = d.ahorro.retiradas;
  const aport = MESES.map((_, i) => sum(cs.map(c => c.m[i])));
  const retir = MESES.map((_, i) => sum(rs.filter(r => r.month === i).map(r => r.amount)));
  const neto = aport.map((a, i) => r2(a - retir[i]));
  const saldoIni = sum(cs.map(c => c.saldo));
  const acum = []; neto.reduce((s, v, i) => (acum[i] = r2(s + v)), saldoIni);
  const fondos = cs.map(c => {
    const aportado = sum(c.m), retirado = sum(rs.filter(r => r.fondo === c.id).map(r => r.amount));
    return { id: c.id, name: c.name, saldo: c.saldo, aportado, retirado, final: r2(c.saldo + aportado - retirado) };
  });
  const sinFondo = sum(rs.filter(r => !cs.some(c => c.id === r.fondo)).map(r => r.amount));
  return { aport, retir, neto, saldoIni, acum, fondos, sinFondo, totAport: sum(aport), totRetir: sum(retir), final: acum[11] ?? saldoIni };
}
function calcGastos(d) {
  const cs = d.gastos.concepts;
  const mes = MESES.map((_, i) => sum(cs.map(c => c.m[i])));
  const porConcepto = cs.map(c => ({ id: c.id, name: c.name, total: sum(c.m) }));
  return { mes, porConcepto, total: sum(mes) };
}

function drawGastosCharts(G, full) {
  const ga = css('--gastos'); const cm = curMonthIdx();
  const media = G.total / 12;
  const mb = chartBase();
  mb.plugins.tooltip.callbacks.footer = items => { const v = items[0]?.parsed.y; return v == null ? '' : `${v >= media ? '+' : ''}${eur(v - media)} vs media`; };
  mb.plugins.tooltip.filter = i => i.datasetIndex === 0;

  const sorted = G.porConcepto.slice().sort((a, b) => b.total - a.total).filter(p => p.total > 0);
  const top = sorted.slice(0, 7), rest = sum(sorted.slice(7).map(p => p.total));

  const vals = top.map(p => p.total).concat(rest ? [rest] : []);
  const cols = top.map((_, i) => SERIES()[i]).concat(rest ? [css('--sother')] : []);
  const pb = { responsive: true, maintainAspectRatio: false, cutout: '64%', animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: { ...chartBase().plugins.tooltip, callbacks: { label: c => ` ${c.label}: ${eur(c.parsed)} (${(c.parsed / G.total * 100).toFixed(1)}%)` } } } };
  upsertChart('gpie', 'c-gpie', { type: 'doughnut', data: { labels, datasets: [{ data: vals, backgroundColor: cols, borderColor: css('--surface'), borderWidth: 2 }] }, options: pb });
  document.getElementById('g-legend').innerHTML = labels.map((l, i) => `<span><i style="background:${cols[i]}"></i>${esc(l)} <span class="num" style="color:var(--fg-3)">${(vals[i] / G.total * 100).toFixed(0)}%</span></span>`).join('');

  const rb = chartBase(); rb.indexAxis = 'y'; rb.interaction = { mode: 'nearest', intersect: true, axis: 'y' };
  rb.scales = { x: { ...rb.scales.y, position: 'top' }, y: { ...rb.scales.x, ticks: { ...rb.scales.x.ticks, color: css('--fg'), autoSkip: false } } };

  upsertChart('grank', 'c-grank', { type: 'bar', data: { labels: rk.map(p => p.name), datasets: [{ label: 'Total', data: rk.map(p => p.total), backgroundColor: ga, borderRadius: 4, borderSkipped: false, barThickness: 14 }] }, options: rb });
  if (full && charts.grank) charts.grank.resize();
}

/* ---------- Grid keyboard nav ---------- */
function bindGridNav(t) {
  t.addEventListener('keydown', e => {
    const el = e.target; if (el.tagName !== 'INPUT') return;
    const td = el.closest('td'), tr = el.closest('tr');
    const col = [...tr.children].indexOf(td);
    let target = null;
    if (e.key === 'Enter' || e.key === 'ArrowDown') target = tr.nextElementSibling?.children[col]?.querySelector('input');
    else if (e.key === 'ArrowUp') target = tr.previousElementSibling?.children[col]?.querySelector('input');
    if (target) { e.preventDefault(); target.focus(); target.select(); }
  });
  t.addEventListener('focusin', e => { if (e.target.tagName === 'INPUT' && !e.target.classList.contains('name')) setTimeout(() => e.target.select(), 0); });
}
function focusLast(sel) { const el = document.querySelector(sel); if (el) { el.focus(); el.select(); } }

/* ---------- Modals ---------- */
function modal(html, bind) {
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  bind(bg, close);
  const f = bg.querySelector('input, select, button.primary'); if (f) f.focus();
}
function confirmBox(title, text, okLabel, onOk) {
  modal(`<h3>${esc(title)}</h3><p class="muted" style="margin:0;font-size:14px">${esc(text)}</p><div class="row"><button class="btn" data-x>Cancelar</button><button class="btn primary danger" data-ok style="background:var(--neg);border-color:var(--neg);color:#fff">${esc(okLabel)}</button></div>`,
    (bg, close) => { bg.querySelector('[data-x]').onclick = close; bg.querySelector('[data-ok]').onclick = () => { close(); onOk(); }; });
}

  (bg, close) => {
    const srcSel = bg.querySelector('#ny-src');
    const sync = () => { const has = !!srcSel.value; bg.querySelector('#ny-amt').disabled = !has; bg.querySelector('#ny-saldo').disabled = !has; };
    srcSel.onchange = sync; sync();
    bg.querySelector('[data-x]').onclick = close;
    bg.querySelector('[data-ok]').onclick = () => {
      const y = String(parseInt(bg.querySelector('#ny-y').value, 10));
      if (!/^\d{4}$/.test(y)) return toast('Escribe un año de cuatro cifras.');
      if (S.years[y]) return toast(`El año ${y} ya existe.`);
      const src = srcSel.value ? S.years[srcSel.value] : null;
      const amt = bg.querySelector('#ny-amt').checked, carry = bg.querySelector('#ny-saldo').checked;
      let nd;
      if (src) {
        const A = calcAhorro(src);
        nd = normalizeYear({ year: +y,
          ahorro: { concepts: src.ahorro.concepts.map(c => ({ id: c.id, name: c.name, saldo: carry ? A.fondos.find(f => f.id === c.id).final : 0, m: amt ? c.m.slice() : [] })), retiradas: [] },
          gastos: { concepts: src.gastos.concepts.map(c => ({ id: c.id, name: c.name, m: amt ? c.m.slice() : [] })) } }, y);
      } else nd = normalizeYear({ year: +y, ahorro: { concepts: [{ name: 'Vacaciones' }, { name: 'Navidad' }], retiradas: [] }, gastos: { concepts: [{ name: 'Alquiler / hipoteca' }, { name: 'Comida' }, { name: 'Luz' }] } }, y);
      S.years[y] = nd; S.year = y; saveUI();
      if (!S.compareSel.includes(y)) S.compareSel = S.compareSel.concat(y).sort();
      scheduleSave(y); close(); renderYearSel(); render(); toast(`Año ${y} creado`);
    };
  });
}
function openDataMenu() {
  modal(`<h3>Datos</h3>
    <p class="muted" style="margin:0;font-size:13px">${S.mode === 'db' ? 'Tus datos se guardan en este dashboard y se sincronizan en todos tus dispositivos.' : S.mode === 'server' ? 'Tus datos se guardan en el servidor de casa (carpeta datos/ junto a server.py). Cualquier dispositivo que abra esta dirección ve los mismos datos.' : 'Tus datos se guardan en este navegador. Exporta una copia de vez en cuando para no perderlos.'}</p>
    <div class="toolbar">
      <button class="btn" data-exp>Exportar copia (.json)</button>
      <button class="btn" data-imp>Importar (.json)</button>
    </div>
    ${S.year ? `<hr style="border:0;border-top:1px solid var(--line);margin:0"><div class="toolbar"><button class="btn danger" data-del>Eliminar el año ${S.year}</button></div>` : ''}
    <div class="row"><button class="btn" data-x>Cerrar</button></div>`,
  (bg, close) => {
    bg.querySelector('[data-x]').onclick = close;
    bg.querySelector('[data-exp]').onclick = () => { close(); exportData(); };
    bg.querySelector('[data-imp]').onclick = () => { close(); document.getElementById('importFile').click(); };
    const del = bg.querySelector('[data-del]');
    if (del) del.onclick = () => { close(); const y = S.year; confirmBox(`¿Eliminar el año ${y}?`, 'Se borran todos sus fondos, retiradas y gastos. No se puede deshacer.', 'Eliminar año', async () => { await deleteYearStore(y); S.year = null; afterDataChange(); toast(`Año ${y} eliminado`); }); };
  });
}
async function exportData() {
  const text = JSON.stringify({ app: 'finanzas-casa', version: 1, years: S.years }, null, 1);
  const filename = `finanzas-casa-${new Date().toISOString().slice(0, 10)}.json`;
  if (S.downloads) {
    try { await S.downloads.save({ filename, data: text }); return; } catch (e) { toast('No se descargó la copia.'); return; }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { toast('Este navegador no permite descargar el archivo.'); }
}
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      let years = {};
      if (j.years) years = j.years; else if (j.year) years[String(j.year)] = j; else throw new Error('formato');
      const ks = Object.keys(years).filter(k => /^\d{4}$/.test(k));
      if (!ks.length) throw new Error('vacío');
      const clash = ks.filter(k => S.years[k]);
      const apply = () => { ks.forEach(k => { S.years[k] = normalizeYear(years[k], k); scheduleSave(k); }); S.year = ks.sort()[ks.length - 1]; S.compareSel = null; afterDataChange(); toast(`Importado: ${ks.join(', ')}`); };
      if (clash.length) confirmBox(`¿Sustituir ${clash.join(', ')}?`, 'Ya tienes datos de ese año. Los del archivo los reemplazarán.', 'Sustituir', apply); else apply();
    } catch (err) { toast('El archivo no tiene el formato de este dashboard.'); }
  };
  rd.readAsText(f);
});

let toastT;
function toast(msg) {
  let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600);
}

/* ---------- Wiring ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; saveUI(); render(); });
document.getElementById('yearSel').onchange = e => { S.year = e.target.value; saveUI(); render(); };
document.getElementById('newYearBtn').onclick = openNewYear;
document.getElementById('moreBtn').onclick = openDataMenu;
const rerenderTheme = () => { if (S.ready) render(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderTheme);
new MutationObserver(rerenderTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (window.Chart) { Chart.defaults.font.family = 'IBM Plex Sans, system-ui, sans-serif'; }

renderTabs();
initStore();
})();
</script>

</body>
